<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinito Digital - Laboratorio Creativo</title>
    <link rel="icon" href="../assets/isotipoups.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="infinito.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo-container">
                <div class="logo-combined">
                    <img src="../assets/upscomunicacionlogo.png" alt="UPS Comunicación">
                </div>
                <div class="logo-single">
                    <img src="../assets/logocomunicacion.png" alt="Comunicación">
                </div>
            </a>
            <div class="isotipo-ups">
                <img src="../assets/logo30.png" alt="UPS">
            </div>
        </div>
    </header>
    
    <main class="main-content" style="margin-top: 0;">
        <section class="indi-hero">
            <div class="indi-hero-content">
                <div class="indi-logo-large">
                    <img src="../assets/indilogo.png" alt="Infinito Digital Logo" class="indi-logo-img">
                </div>
                <a href="../index.html" class="back-career-btn"><i class="fas fa-arrow-left"></i> Volver a la Carrera</a>
            </div>
            </section>

        <section class="gallery-section">
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Todo</button>
                <button class="filter-btn" data-filter="editorial">Editorial</button>
                <button class="filter-btn" data-filter="sonora">Sonora</button>
                <button class="filter-btn" data-filter="visual">Visual</button>
                <button class="filter-btn" data-filter="audiovisual">Audiovisual</button>
                <button class="filter-btn" data-filter="multimedia">Multimedia</button>
                <button class="filter-btn" data-filter="radio mensaje">Radio Mensaje</button>
                <button class="filter-btn" data-filter="jorcom">JorCom</button>
                <button class="filter-btn" data-filter="webinars">Webinars</button>
            </div>

            <div class="projects-grid" id="projectsGrid">
                </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Infinito Digital</h3>
                <p>Donde las ideas cobran vida.</p>
            </div>
            <div class="footer-bottom"><p>&copy; 2023 Infinito Digital - UPSQ.</p></div>
        </div>
    </footer>

    <button id="scrollTopBtn" title="Volver arriba">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="../script.js"></script>
    <script src="infinito.js"></script>
</body>
</html>
